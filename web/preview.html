<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overlay Preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  .frame { position: absolute; inset: 0; margin: auto; width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; height: auto; }
  .frame img, .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .frame img { object-fit: cover; }
  .frame iframe { background: transparent; }
</style>
</head>
<body>
<!-- Shows the overlay over a frame of the stream. Query parameters are passed through, e.g. /preview?layout=hud&demo=1 -->
<div class="frame"><img src="preview-bg.jpg" alt=""><iframe id="f" title="overlay"></iframe></div>
<script>document.getElementById('f').src = '/' + location.search;</script>
</body>
</html>
